[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-risk-monitoring"
version = "0.1.0"
description = "供应商风险监控平台 MVP"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.10,<4",
    "bcrypt>=4,<5",
    "cryptography>=50,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
    "types-openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
[[tool.mypy.overrides]]
module = ["apscheduler.*", "bcrypt"]
ignore_missing_imports = true
