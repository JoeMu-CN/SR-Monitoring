name: supplier-risk-frontend-gap-test

x-test-environment: &test-environment
  DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://supplier_risk_test:test_only_password@postgres-test:5432/supplier_risk_test}
  APP_ENV: test
  AI_PROVIDER: fake
  ALLOWED_ORIGINS: http://127.0.0.1:18080,http://testserver
  SESSION_SECRET: todo3-test-session-secret-not-for-production
  BOOTSTRAP_ADMIN_USERNAME: ""
  BOOTSTRAP_ADMIN_PASSWORD: ""

x-test-volumes: &test-volumes
  - ./backend/app:/app/app:ro
  - ./backend/tests:/app/tests:ro
  - ./backend/alembic:/app/alembic:ro
  - ./backend/alembic.ini:/app/alembic.ini:ro

services:
  postgres-test:
    image: postgis/postgis:16-3.5-alpine@sha256:d2fe6296c8ed5b21b31a426f51b9176b4d89f80a0a380632a7a833d604951273
    environment:
      POSTGRES_DB: supplier_risk_test
      POSTGRES_USER: supplier_risk_test
      POSTGRES_PASSWORD: test_only_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U supplier_risk_test -d supplier_risk_test"]
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"

  app-test:
    image: supplierriskmonitoring-app
    environment: *test-environment
    volumes: *test-volumes
    command:
      - sh
      - -c
      - alembic upgrade head && python tests/seed_e2e.py && uvicorn app.main:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/system/health', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      postgres-test:
        condition: service_healthy
    restart: "no"

  test-runner:
    image: supplierriskmonitoring-app
    environment: *test-environment
    volumes: *test-volumes
    depends_on:
      postgres-test:
        condition: service_healthy
    profiles: ["tools"]
    restart: "no"
