services:
  postgres:
    image: postgis/postgis:16-3.5-alpine@sha256:d2fe6296c8ed5b21b31a426f51b9176b4d89f80a0a380632a7a833d604951273
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplier_risk}
      POSTGRES_USER: ${POSTGRES_USER:-supplier_risk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_mvp_change_me}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-supplier_risk} -d ${POSTGRES_DB:-supplier_risk}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    image: supplierriskmonitoring-app
    build:
      context: .
      dockerfile: Dockerfile
    # 容器内使用公共 DNS，绕开宿主机代理 fake-ip（198.18.0.0/16）导致的
    # SSRF 校验误拒；AliDNS 223.5.5.5 优先，119.29.29.29 兜底
    dns:
      - 223.5.5.5
      - 119.29.29.29
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://supplier_risk:local_mvp_change_me@postgres:5432/supplier_risk}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      SIGNAL_ANALYZE_BATCH: ${SIGNAL_ANALYZE_BATCH:-20}
      RESEARCH_CRAWL4AI_ENABLED: ${RESEARCH_CRAWL4AI_ENABLED:-false}
      RESEARCH_CRAWL4AI_BASE_URL: ${RESEARCH_CRAWL4AI_BASE_URL:-http://crawl4ai:11235}
      RESEARCH_CRAWL4AI_API_TOKEN: ${RESEARCH_CRAWL4AI_API_TOKEN:-${CRAWL4AI_API_TOKEN:-}}
      RESEARCH_CRAWL4AI_TIMEOUT_SECONDS: ${RESEARCH_CRAWL4AI_TIMEOUT_SECONDS:-120}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/system/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - internal
    volumes:
      - evidence_data:/app/data/evidence
    restart: unless-stopped

  scheduler:
    image: supplierriskmonitoring-app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic upgrade $${ALEMBIC_UPGRADE_TARGET:-head} && python -m app.scheduler.main"]
    dns:
      - 223.5.5.5
      - 119.29.29.29
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://supplier_risk:local_mvp_change_me@postgres:5432/supplier_risk}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      ALEMBIC_UPGRADE_TARGET: ${ALEMBIC_UPGRADE_TARGET:-head}
      SIGNAL_ANALYZE_BATCH: ${SIGNAL_ANALYZE_BATCH:-20}
      SCHEDULER_COLLECT_CRON: ${SCHEDULER_COLLECT_CRON:-*/30 * * * *}
      SCHEDULER_EXPIRE_CRON: ${SCHEDULER_EXPIRE_CRON:-0 * * * *}
      SCHEDULER_CLEANUP_CRON: ${SCHEDULER_CLEANUP_CRON:-0 3 * * *}
      RESEARCH_SCHEDULE_OWNER_USERNAME: "${RESEARCH_SCHEDULE_OWNER_USERNAME:-}"
      RESEARCH_DAILY_CRON: "${RESEARCH_DAILY_CRON:-0 8 * * *}"
      RESEARCH_DAILY_TOPIC: "${RESEARCH_DAILY_TOPIC:-}"
      RESEARCH_WEEKLY_CRON: "${RESEARCH_WEEKLY_CRON:-30 8 * * mon}"
      RESEARCH_WEEKLY_TOPIC: "${RESEARCH_WEEKLY_TOPIC:-}"
      RESEARCH_MONTHLY_ENABLED: "${RESEARCH_MONTHLY_ENABLED:-false}"
      RESEARCH_MONTHLY_CRON: "${RESEARCH_MONTHLY_CRON:-0 9 1 * *}"
      RESEARCH_MONTHLY_TOPIC: "${RESEARCH_MONTHLY_TOPIC:-}"
      RESEARCH_MONTHLY_SUPPLIER_SCOPE: "${RESEARCH_MONTHLY_SUPPLIER_SCOPE:-limited}"
      RESEARCH_MONTHLY_SUPPLIER_LIMIT: "${RESEARCH_MONTHLY_SUPPLIER_LIMIT:-100}"
      RETENTION_SIGNAL_DAYS: ${RETENTION_SIGNAL_DAYS:-90}
      RETENTION_EVENT_DAYS: ${RETENTION_EVENT_DAYS:-90}
      RETENTION_RUN_DAYS: ${RETENTION_RUN_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  research-worker:
    image: supplierriskmonitoring-app
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "alembic upgrade $${ALEMBIC_UPGRADE_TARGET:-head} && python -m app.research.runner"]
    profiles: ["research-local-test"]
    dns:
      - 223.5.5.5
      - 119.29.29.29
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://supplier_risk:local_mvp_change_me@postgres:5432/supplier_risk}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RESEARCH_WORKER_ENABLED: ${RESEARCH_WORKER_ENABLED:-false}
      # local_lifecycle_test 不访问外网；topic_source_discovery 按主题搜索并受控读取候选页面。
      RESEARCH_WORKER_MODE: ${RESEARCH_WORKER_MODE:-local_lifecycle_test}
      # 全局默认旧执行器；本地启动脚本会显式切换 langgraph，仍复用相同 Worker、任务预算和安全边界。
      RESEARCH_ORCHESTRATOR: ${RESEARCH_ORCHESTRATOR:-legacy}
      RESEARCH_WORKER_POLL_SECONDS: ${RESEARCH_WORKER_POLL_SECONDS:-5}
      RESEARCH_WORKER_LEASE_SECONDS: ${RESEARCH_WORKER_LEASE_SECONDS:-300}
      RESEARCH_WORKER_HEARTBEAT_INTERVAL_SECONDS: ${RESEARCH_WORKER_HEARTBEAT_INTERVAL_SECONDS:-15}
      RESEARCH_WORKER_HEARTBEAT_STALE_SECONDS: ${RESEARCH_WORKER_HEARTBEAT_STALE_SECONDS:-60}
      ALEMBIC_UPGRADE_TARGET: ${ALEMBIC_UPGRADE_TARGET:-head}
      RESEARCH_CRAWL4AI_ENABLED: ${RESEARCH_CRAWL4AI_ENABLED:-false}
      RESEARCH_CRAWL4AI_BASE_URL: ${RESEARCH_CRAWL4AI_BASE_URL:-http://crawl4ai:11235}
      RESEARCH_CRAWL4AI_API_TOKEN: ${RESEARCH_CRAWL4AI_API_TOKEN:-${CRAWL4AI_API_TOKEN:-}}
      RESEARCH_CRAWL4AI_TIMEOUT_SECONDS: ${RESEARCH_CRAWL4AI_TIMEOUT_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - internal
    restart: "no"

volumes:
  postgres_data:
  evidence_data:

networks:
  internal:
    driver: bridge
