<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SR / 供应商风险监控 - 企业级风险智能平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&family=IBM+Plex+Sans:wght@700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-display: block;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-display: block;
      }
      /* Pre-React HTML Splash Screen Styling */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f7f9ff;
        z-index: 9999;
      }
      .loader-logo {
        width: 64px;
        height: 64px;
        background-color: #004782;
        color: #ffffff;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 24px;
        box-shadow: 0 10px 25px rgba(0, 71, 130, 0.2);
        margin-bottom: 24px;
        font-family: Georgia, serif;
      }
      .loader-dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .loader-dots span {
        width: 10px;
        height: 10px;
        background-color: #004782;
        border-radius: 50%;
        animation: pulseDots 1s infinite ease-in-out;
      }
      .loader-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loader-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes pulseDots {
        0%, 100% { transform: scale(0.7); opacity: 0.3; }
        50% { transform: scale(1.3); opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-[#f7f9ff] text-[#101d28] antialiased">
    <div id="root">
      <div id="initial-loader">
        <div class="loader-logo">SR</div>
        <div class="loader-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
